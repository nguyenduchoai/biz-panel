[package]
name = "biz-panel"
version = "2.0.0"
edition = "2021"
authors = ["Bizino Services"]
description = "Premium Server Management Panel - Built with Rust"
license = "MIT"

[[bin]]
name = "biz-panel"
path = "src/main.rs"

[dependencies]
# Web Framework
axum = { version = "0.7", features = ["ws", "multipart", "macros"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "fs", "trace", "compression-gzip"] }

# Async Runtime
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.21"
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Templates
askama = { version = "0.12", features = ["with-axum"] }
askama_axum = "0.4"

# Authentication
jsonwebtoken = "9"
bcrypt = "0.15"

# System Metrics
sysinfo = "0.30"

# Docker
bollard = "0.16"

# Database (embedded)
rusqlite = { version = "0.31", features = ["bundled"] }

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
parking_lot = "0.12"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"

# Config
toml = "0.8"
dirs = "5"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI
clap = { version = "4", features = ["derive"] }

# HTTP Client (for Let's Encrypt etc.)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Process management
nix = { version = "0.28", features = ["signal", "process", "fs", "user"] }

# Portable pty for terminal
portable-pty = "0.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
